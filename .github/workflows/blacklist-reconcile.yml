name: Blacklist Auto Reconcile

# 黑名单动态管理对账流水线（纯分析 + 补丁）：
#   - 本仓库不保存黑名单副本：U / 索引 / 日志匹配库每轮运行时从上游
#     Ascend/pytorch ci-test 分支 conf 拉取，永不静态复制。
#   - 候选与补丁：制品输出 candidates.json / summary.md / blacklist_update.patch；
#     补丁为针对上游 conf 的最小 unified diff，在上游仓库根目录
#     `git apply -p1 <patch>` 即可应用。
#   - 手动触发可勾选 auto_commit=true，把补丁提交到本仓库 blacklist_updates/
#     （仅存档供审阅，不含黑名单本体；默认 false 只出制品）。
#   - 本仓库每轮固定持久化：status_history/（跨轮连续判定依据），运行结束提交。
#
# 触发与数据源（§1.1）：
#   - 只在默认分支生效；本仓库即「独立分析仓库」。
#   - 拉数据：gh api 只读拉取 Ascend/pytorch，须用 secrets.ASCEND_PAT
#     （仓库约束：访问 Ascend/pytorch 须用 PAT，不能用 github.token）。
#
# 数据源（三路）：
#   加入线（§2 / §6.1）：
#     - nightly-main-full-a3.yml 的 test-reports 制品 -> platform=a3
#     - nightly-main-full-a5.yml 的 test-reports 制品 -> platform=a5
#       （a3/a5 排除黑名单后的全量 nodeid 执行结果）
#   删减线（§2 / §6.2）：
#     - blacklist-test.yml：本流水线先触发（ci-test 分支、无参）并等待完成，
#       再直接取上游聚合好的 blacklist-report.json（一行一个 U 内 nodeid，
#       自带 a3_status / a5_status 与日志，无需下载全部 shard 再猜平台）。

on:
  schedule:
    # UTC 18:00 = Beijing 02:00，紧跟上游 nightly 之后
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      auto_commit:
        description: '提交黑名单更新补丁到 blacklist_updates/（默认 false = 仅制品）'
        required: false
        default: false
        type: boolean

# contents: write 供提交 status_history / 补丁回本仓库；拉上游仅用 secrets.ASCEND_PAT
permissions:
  contents: write

concurrency:
  group: blacklist-reconcile
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Ascend/pytorch

jobs:
  reconcile:
    runs-on: ubuntu-latest
    # 触发 blacklist-test + 等待完成 + 三源下载，可能数小时
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 提交 status_history 时避免非快进失败

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. 先触发删减线巡检（blacklist-test，ci-test 分支，无参），拿 run_id
      - name: Trigger blacklist-test (删减线复测)
        id: trigger
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_upstream.py \
            --trigger-workflow blacklist-test.yml \
            --ref ci-test | tee trigger.log
          RUN_ID="$(grep -oP '(?<=run_id=)[0-9]+' trigger.log | tail -1)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "- blacklist-test run: [$RUN_ID](https://github.com/$UPSTREAM_REPO/actions/runs/$RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

      # 2. 拉加入线 full-a3 / full-a5 的 test-reports（最近成功 run，全量制品）
      - name: Download full-a3 / full-a5 (加入线)
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_upstream.py \
            --workflow nightly-main-full-a3.yml --artifact test-reports \
            --download-all --out-dir reports/full-a3
          python3 scripts/fetch_upstream.py \
            --workflow nightly-main-full-a5.yml --artifact test-reports \
            --download-all --out-dir reports/full-a5

      # 3. 运行时拉取上游黑名单 conf（构建 U/索引/匹配库的唯一数据源，本仓库不存副本）
      - name: Fetch upstream blacklist conf
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_upstream.py \
            --fetch-conf --out-dir reports/upstream_conf

      # 4. 等删减线巡检完成，并读取 conclusion（结束 != 成功）
      #    上游失败 -> 直接中止，避免用不完整数据误判候选
      - name: Wait blacklist-test
        id: wait
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          CONCL="$(python3 scripts/fetch_upstream.py --wait "$RUN_ID" | grep -oP '(?<=conclusion=)\S+' | tail -1)"
          echo "conclusion=$CONCL" >> "$GITHUB_OUTPUT"
          if [ "$CONCL" != "success" ]; then
            echo "::error::blacklist-test run $RUN_ID 失败 (conclusion=$CONCL)，中止对账：数据不全，避免误判候选"
            exit 1
          fi

      # 5. 拉删减线复测结果（已确认上游成功才会走到这里）
      #    直接取上游聚合好的 blacklist-report.json：一行一个 U 内 nodeid，
      #    自带 a3_status / a5_status / 日志，无需下载全部 shard 再猜平台
      - name: Download blacklist-report (删减线)
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/fetch_upstream.py \
            --run-id "$RUN_ID" --artifact blacklist-report \
            --artifact-member blacklist-report.json \
            --out-dir reports/patrol

      # 6. 解析三源 -> out/parsed_cases.json（full=显式平台，patrol=报告字段）
      - name: Parse & classify
        env:
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/parse_and_classify.py \
            --run-id "$RUN_ID" \
            --out out/parsed_cases.json \
            --full-a3-dir reports/full-a3 \
            --full-a5-dir reports/full-a5 \
            --patrol-report reports/patrol/blacklist-report.json

      # 7. 对账（纯分析：候选 + 上游格式补丁都进制品，本仓库不写黑名单本体）
      - name: Reconcile (analysis + patch)
        env:
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/reconcile.py \
            --parsed out/parsed_cases.json \
            --run-id "$RUN_ID" \
            --upstream-conf-dir reports/upstream_conf \
            --patch-out out/blacklist_update.patch | tee reconcile.log
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidates artifact
        uses: actions/upload-artifact@v4
        with:
          name: blacklist-reconcile-${{ steps.trigger.outputs.run_id }}
          path: |
            out/candidates.json
            out/audit_preview.json
            out/summary.md
            out/blacklist_update.patch
          if-no-files-found: error

      # 8. 手动触发且勾选 auto_commit 时，把补丁存档提交到 blacklist_updates/
      #    （只含 diff，不含黑名单本体；人工审阅后到上游 git apply）
      - name: Commit blacklist update patch
        if: ${{ inputs.auto_commit }}
        env:
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ ! -s out/blacklist_update.patch ]; then
            echo "patch is empty (no blacklist changes this run), nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p blacklist_updates
          DEST="blacklist_updates/$(date -u +%Y-%m-%d)_${RUN_ID}.patch"
          cp out/blacklist_update.patch "$DEST"
          git add "$DEST"
          git commit -m "chore(blacklist): add reconcile patch for upstream run ${RUN_ID}"
          git push
          echo "- 补丁已提交: \`$DEST\`" >> "$GITHUB_STEP_SUMMARY"

      # 9. 持久化 status_history（本仓库固定回写：跨轮连续判定的状态，与候选无关）
      - name: Persist status_history
        env:
          RUN_ID: ${{ steps.trigger.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status_history
          if git diff --cached --quiet; then
            echo "no new status_history records, nothing to commit"
            exit 0
          fi
          git commit -m "chore(status_history): append records of upstream run ${RUN_ID}"
          git push
