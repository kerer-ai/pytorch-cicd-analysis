name: Trigger Ascend Nightly main-full A3 & A5

# Scheduled trigger for two Ascend/pytorch "upstream torch main, full"
# nightlies on ci-test:
#   - nightly-main-full-a3.yml (Nightly Build and Test A3, main, full)
#   - nightly-main-full-a5.yml (Nightly Build and Test A5, main, full)
# Both only exist on the ci-test branch and expose bare workflow_dispatch
# (no inputs), so they are dispatched with --ref ci-test.
# Rename history: nightly_all.yml -> nightly-a3.yml (393d083b, 2026-09-30)
# -> nightly-main-full-a3.yml (57c53768, 2026-11-17); nightly-a5.yml ->
# nightly-main-full-a5.yml (57c53768). After such renames the GitHub API
# keeps the stale old-name workflow record; dispatching the old name fails
# with a misleading HTTP 422 "Workflow does not have 'workflow_dispatch'
# trigger".
# Note: nightly-main-full-a3 also keeps its own upstream schedule (UTC
# 17:00 = Beijing 01:00); this trigger fires at Beijing 21:20 on
# Tue/Thu/Sat for a second run, and the active-run guard below skips
# dispatch when the upstream schedule already has a run in flight.
#
# Schedule: Tue/Thu/Sat 21:20 Beijing = UTC 13:20. Minute stays off :00/:30
# because GitHub drops/delays on-the-hour/half-hour scheduled runs under
# load (see monitor-trigger-pr-ci.yml); a dropped tick here means a missed
# nightly. Caution: UTC 13:20 is inside the US-morning peak that observed
# 2026-10 (UTC 13:45/15:24) ran ~5h late or dropped whole days — expect
# occasional delayed/missed ticks at this slot.

on:
  schedule:
    - cron: '20 13 * * 2,4,6' # UTC 13:20 Tue/Thu/Sat = Beijing 21:20 Tue/Thu/Sat
  workflow_dispatch: # keep manual trigger for testing

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Ascend/pytorch nightly-main-full a3 & a5
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
        run: |
          set -euo pipefail
          FAILURES=""
          for wf in nightly-main-full-a3.yml nightly-main-full-a5.yml; do
            # Guard: skip if this upstream workflow is already running/queued
            ACTIVE=$(gh run list --workflow="$wf" --repo Ascend/pytorch \
              --status in_progress --json databaseId --jq 'length')
            QUEUED=$(gh run list --workflow="$wf" --repo Ascend/pytorch \
              --status queued --json databaseId --jq 'length')
            if [ "$((ACTIVE + QUEUED))" -gt 0 ]; then
              echo "### $wf: skipped (already active: ${ACTIVE} running, ${QUEUED} queued)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if gh workflow run "$wf" --repo Ascend/pytorch --ref ci-test; then
              sleep 15 # let the dispatched run register before listing it
              {
                echo "### $wf: triggered"
                gh run list --workflow="$wf" --repo Ascend/pytorch \
                  --event workflow_dispatch -L 1 \
                  --json url,createdAt,databaseId
              } | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::failed to trigger $wf"
              FAILURES="$FAILURES $wf"
            fi
          done
          if [ -n "$FAILURES" ]; then
            echo "::error::trigger failed for:$FAILURES"
            exit 1
          fi
