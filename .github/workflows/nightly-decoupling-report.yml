name: Nightly Decoupling Report

on:
  schedule:
    - cron: '0 2 * * *' # UTC 02:00 = Beijing 10:00
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Ascend/pytorch nightly run ID (skips auto-discovery if set)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-decoupling-report
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Ascend/pytorch
  UPSTREAM_WORKFLOW: nightly.yml
  COLLECT_WORKFLOW: nightly-collect-only.yml

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 查询近 24 小时内最近一次执行成功（success）的 nightly run；
      # workflow_dispatch 指定 run_id 时跳过发现，直接使用
      - name: Find latest successful nightly run (last 24h)
        id: find-run
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN_ID" ]; then
            echo "run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "### Upstream nightly run" >> "$GITHUB_STEP_SUMMARY"
            echo "- run: manually specified [$INPUT_RUN_ID](https://github.com/$UPSTREAM_REPO/actions/runs/$INPUT_RUN_ID) (window filter bypassed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SINCE_UTC=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          export SINCE_UTC
          RUN=$(gh api "repos/$UPSTREAM_REPO/actions/workflows/$UPSTREAM_WORKFLOW/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success" and .updated_at >= env.SINCE_UTC)] | sort_by(.updated_at) | last // empty')
          if [ -z "$RUN" ]; then
            echo "## Skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "No successful nightly run in the last 24 hours (since ${SINCE_UTC})." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID=$(echo "$RUN" | jq -r '.id')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "### Upstream nightly run" >> "$GITHUB_STEP_SUMMARY"
          echo "- run: [#${RUN_ID}]($(echo "$RUN" | jq -r '.html_url'))" >> "$GITHUB_STEP_SUMMARY"
          echo "- completed at: $(echo "$RUN" | jq -r '.updated_at')" >> "$GITHUB_STEP_SUMMARY"

      # 查询最近一次执行成功的 nightly-collect-only 采集 run：
      # 优先 24h 内，没有则扩大到 7 天内；都没有时降级为静态 comparison md（只填 A3 列）
      - name: Find latest successful collect run (24h → 7d)
        id: find-collect-run
        if: steps.find-run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SINCE_24H=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          SINCE_7D=$(date -u -d '7 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          export SINCE_24H SINCE_7D
          RUN=$(gh api "repos/$UPSTREAM_REPO/actions/workflows/$COLLECT_WORKFLOW/runs?per_page=50" \
            --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success" and .updated_at >= env.SINCE_24H)] | sort_by(.updated_at) | last // empty')
          WINDOW="24h"
          if [ -z "$RUN" ]; then
            RUN=$(gh api "repos/$UPSTREAM_REPO/actions/workflows/$COLLECT_WORKFLOW/runs?per_page=50" \
              --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success" and .updated_at >= env.SINCE_7D)] | sort_by(.updated_at) | last // empty')
            WINDOW="7d"
          fi
          if [ -z "$RUN" ]; then
            echo "collect_run_id=" >> "$GITHUB_OUTPUT"
            echo "::warning::No successful collect run in the last 7 days; precollect falls back to static comparison md."
            exit 0
          fi
          echo "collect_run_id=$(echo "$RUN" | jq -r '.id')" >> "$GITHUB_OUTPUT"
          echo "### Upstream collect run" >> "$GITHUB_STEP_SUMMARY"
          echo "- window: $WINDOW (24h first, then 7d)" >> "$GITHUB_STEP_SUMMARY"
          echo "- run: [#$(echo "$RUN" | jq -r '.id')]($(echo "$RUN" | jq -r '.html_url'))" >> "$GITHUB_STEP_SUMMARY"
          echo "- completed at: $(echo "$RUN" | jq -r '.updated_at')" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        if: steps.find-run.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Go
        if: steps.find-run.outputs.skip != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download npu-full-test-summary artifact
        if: steps.find-run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.find-run.outputs.run_id }}
        run: |
          set -euo pipefail
          AID=$(gh api "repos/$UPSTREAM_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("npu-full-test-summary")) | .id' | head -1)
          if [ -z "$AID" ]; then
            echo "::error::npu-full-test-summary artifact not found for run $RUN_ID"
            exit 1
          fi
          gh api "repos/$UPSTREAM_REPO/actions/artifacts/$AID/zip" > npu-full-test-summary.zip
          ls -lh npu-full-test-summary.zip

      - name: Download collection artifacts (cases-shards / cases-shards-a5)
        if: steps.find-run.outputs.skip != 'true' && steps.find-collect-run.outputs.collect_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_RUN_ID: ${{ steps.find-collect-run.outputs.collect_run_id }}
        run: |
          set -euo pipefail
          mkdir -p collection
          gh api "repos/$UPSTREAM_REPO/actions/runs/$COLLECT_RUN_ID/artifacts" > artifacts.json
          for NAME in cases-shards cases-shards-a5; do
            AID=$(jq -r --arg n "$NAME" '.artifacts[] | select(.name == $n) | .id' artifacts.json | head -1)
            if [ -z "$AID" ]; then
              echo "::warning::$NAME artifact not found for collect run $COLLECT_RUN_ID"
              continue
            fi
            gh api "repos/$UPSTREAM_REPO/actions/artifacts/$AID/zip" > "collection/$NAME.zip"
            mkdir -p "collection/$NAME"
            unzip -q -o "collection/$NAME.zip" -d "collection/$NAME"
            echo "- $NAME: $(ls "collection/$NAME" | wc -l) files" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Generate decoupling report
        if: steps.find-run.outputs.skip != 'true'
        env:
          RUN_ID: ${{ steps.find-run.outputs.run_id }}
        run: |
          set -euo pipefail
          go build -o reportgen ./cmd/reportgen
          ARGS=()
          if [ -d collection/cases-shards ]; then ARGS+=(-collect-a3 collection/cases-shards); fi
          if [ -d collection/cases-shards-a5 ]; then ARGS+=(-collect-a5 collection/cases-shards-a5); fi
          ./reportgen -run-id "$RUN_ID" -artifact npu-full-test-summary.zip -out out "${ARGS[@]}" | tee reportgen.log
          {
            echo "### Report stats"
            echo '```'
            cat reportgen.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: steps.find-run.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-decoupling-report-${{ steps.find-run.outputs.run_id }}
          path: |
            out/**/*
            !out/**/report.zip
          retention-days: 90
          if-no-files-found: error
