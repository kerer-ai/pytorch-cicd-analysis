name: Trigger Ascend Nightly main-label-a3

# Daily trigger for the Ascend/pytorch "label-filtered" nightly on ci-test:
#   - nightly-main-label-a3.yml (Nightly Build and Test A3, label-filtered,
#     hw_classification 'GENERIC ACCELERATOR')
# It only exists on the ci-test branch, exposes bare workflow_dispatch
# (no inputs), and has NO schedule of its own — this trigger is its only
# daily schedule (UTC 10:40 = Beijing 18:40).
# Note: upstream renamed nightly.yml -> nightly-main-label-a3.yml in
# 57c53768 (2026-11-17, "rename nightly entries to version-agnostic
# main-line names"). After such renames the GitHub API keeps the stale
# old-name workflow record; dispatching the old name fails with a
# misleading HTTP 422 "Workflow does not have 'workflow_dispatch' trigger".

on:
  schedule:
    - cron: '40 10 * * *' # UTC 10:40 = Beijing 18:40
  workflow_dispatch: # keep manual trigger for testing

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check upstream nightly status (guard)
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
        run: |
          set -euo pipefail
          ACTIVE=$(gh run list --workflow=nightly-main-label-a3.yml --repo Ascend/pytorch \
            --status in_progress --json databaseId --jq 'length')
          QUEUED=$(gh run list --workflow=nightly-main-label-a3.yml --repo Ascend/pytorch \
            --status queued --json databaseId --jq 'length')
          if [ "$((ACTIVE + QUEUED))" -gt 0 ]; then
            echo "Skipped: upstream nightly-main-label-a3 already active (${ACTIVE} running, ${QUEUED} queued)" \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Trigger Ascend/pytorch nightly-main-label-a3
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
        run: |
          set -euo pipefail
          gh workflow run nightly-main-label-a3.yml --repo Ascend/pytorch --ref ci-test
          sleep 15
          echo "### Triggered upstream run" >> "$GITHUB_STEP_SUMMARY"
          gh run list --workflow=nightly-main-label-a3.yml --repo Ascend/pytorch \
            --event workflow_dispatch -L 1 \
            --json url,createdAt,databaseId \
            | tee -a "$GITHUB_STEP_SUMMARY"
