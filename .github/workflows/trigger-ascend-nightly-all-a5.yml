name: Trigger Ascend Nightly All & A5

# Scheduled trigger for two Ascend/pytorch "full test" nightlies on ci-test:
#   - nightly-a3.yml   (Nightly Build and Test A3 (All))
#   - nightly-a5.yml   (Nightly Build and Test A5 (All))
# Both only exist on the ci-test branch and expose bare workflow_dispatch
# (no inputs), so they are dispatched with --ref ci-test.
# Note: upstream renamed nightly_all.yml -> nightly-a3.yml in 393d083b
# (2026-09-30); dispatching the stale old name fails with a misleading
# HTTP 422 "Workflow does not have 'workflow_dispatch' trigger".
#
# Schedule: daily 21:45 Beijing = UTC 13:45. Minute stays off :00/:30
# because GitHub drops/delays on-the-hour/half-hour scheduled runs under
# load (see monitor-trigger-pr-ci.yml); a dropped tick here means a missed
# nightly.

on:
  schedule:
    - cron: '45 13 * * *' # UTC 13:45 daily = Beijing 21:45
  workflow_dispatch: # keep manual trigger for testing

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Ascend/pytorch nightly-a3 & nightly-a5
        env:
          GH_TOKEN: ${{ secrets.ASCEND_PAT }}
        run: |
          set -euo pipefail
          FAILURES=""
          for wf in nightly-a3.yml nightly-a5.yml; do
            # Guard: skip if this upstream workflow is already running/queued
            ACTIVE=$(gh run list --workflow="$wf" --repo Ascend/pytorch \
              --status in_progress --json databaseId --jq 'length')
            QUEUED=$(gh run list --workflow="$wf" --repo Ascend/pytorch \
              --status queued --json databaseId --jq 'length')
            if [ "$((ACTIVE + QUEUED))" -gt 0 ]; then
              echo "### $wf: skipped (already active: ${ACTIVE} running, ${QUEUED} queued)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if gh workflow run "$wf" --repo Ascend/pytorch --ref ci-test; then
              sleep 15 # let the dispatched run register before listing it
              {
                echo "### $wf: triggered"
                gh run list --workflow="$wf" --repo Ascend/pytorch \
                  --event workflow_dispatch -L 1 \
                  --json url,createdAt,databaseId
              } | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::failed to trigger $wf"
              FAILURES="$FAILURES $wf"
            fi
          done
          if [ -n "$FAILURES" ]; then
            echo "::error::trigger failed for:$FAILURES"
            exit 1
          fi
